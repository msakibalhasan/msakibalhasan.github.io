<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160">
  <defs>
    <linearGradient id="grad" x1="24" y1="22" x2="136" y2="138" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7ee7ff"/>
      <stop offset=".45" stop-color="#28b7ff"/>
      <stop offset="1" stop-color="#8a6cff"/>
    </linearGradient>
    <linearGradient id="shine" x1="35" y1="30" x2="125" y2="125" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity=".30"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".03"/>
    </linearGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="9" y="9" width="142" height="142" rx="42" fill="#06101a" stroke="url(#grad)" stroke-opacity=".45" stroke-width="2"/>
  <rect x="18" y="18" width="124" height="124" rx="34" fill="url(#shine)" stroke="#ffffff" stroke-opacity=".12"/>

  <circle cx="80" cy="80" r="48" fill="none" stroke="url(#grad)" stroke-width="3" stroke-dasharray="78 18 42 18" opacity=".8"/>
  <circle cx="80" cy="80" r="39" fill="#07131f" stroke="#ffffff" stroke-opacity=".08"/>

  <path d="M99 55c-6-7-15-11-25-11-13 0-23 7-23 17 0 10 8 14 24 18 14 3 21 7 21 17 0 11-10 19-24 19-12 0-22-5-28-13"
        fill="none" stroke="url(#grad)" stroke-width="7" stroke-linecap="round" filter="url(#softGlow)"/>

  <path d="M91 104l18-49" stroke="#f6fbff" stroke-width="6" stroke-linecap="round"/>
  <path d="M101 104h17" stroke="#7ee7ff" stroke-width="5" stroke-linecap="round"/>

  <circle cx="38" cy="48" r="3.5" fill="#7ee7ff"/>
  <circle cx="125" cy="112" r="3.5" fill="#8a6cff"/>
