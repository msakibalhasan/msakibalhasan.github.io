    <!-- =========================
         PAGE CONTENT
         ========================= -->

    <main>

        <div class="container">

            
<section class="page-header">

    <span class="section-kicker">
        06 / SEND A MESSAGE
    </span>

    <h1>
        Contact <span class="blue-text">Form</span>
    </h1>

    <p>
        Visitors can use this form to contact you.
        Connect it later with your own backend or form service.
    </p>

</section>


<form
    class="form-card glass"
    action="#"
    method="post"
>

    <div class="form-grid">


        <div class="form-field">

            <label>
                YOUR NAME
            </label>

            <input
                type="text"
                name="name"
                placeholder="Enter your name"
                required
            >

        </div>


        <div class="form-field">

            <label>
                EMAIL ADDRESS
            </label>

            <input
                type="email"
                name="email"
                placeholder="you@example.com"
                required
            >

        </div>


        <div class="form-field">

            <label>
                SUBJECT
            </label>

            <input
                type="text"
                name="subject"
                placeholder="What is this about?"
            >

        </div>


        <div class="form-field">

            <label>
                REASON
            </label>

            <select name="reason">

                <option>
                    General Inquiry
                </option>

                <option>
                    Web Development
                </option>

                <option>
                    Collaboration
                </option>

                <option>
                    Other
                </option>

            </select>

        </div>


        <div class="form-field full">

            <label>
                MESSAGE
            </label>

            <textarea
                name="message"
                placeholder="Write your message..."
                required
            ></textarea>

        </div>


        <div class="form-field full">

            <button
                type="submit"
                class="button button-primary"
            >

                <i class="fa-regular fa-paper-plane"></i>

                Send Message

            </button>

        </div>


    </div>

</form>


        </div>

    </main>
